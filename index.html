<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <!-- Home-screen app: the manifest link is added by src/pwa.ts, one per language. -->
    <meta name="theme-color" content="#13100d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Hall of Faces</title>
    <meta name="description" content="Guess the characters of A Song of Ice and Fire by their portraits" />
    <!-- Link previews of the plain address, in English. Crawlers don't run JS, so the tags are static;
         <lang>/ pages (built by vite.config.ts) carry them in each language. URLs must be absolute. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hall of Faces" />
    <meta property="og:url" content="https://stegantsev.github.io/Hall-of-faces/" />
    <meta property="og:title" content="Hall of Faces" />
    <meta property="og:description" content="Guess the characters of A Song of Ice and Fire by their portraits" />
    <meta property="og:image" content="https://stegantsev.github.io/Hall-of-faces/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A candlelit hall with rows of faces carved into its pillars" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <!-- Visit stats (GoatCounter, no cookies). Counted by src/stats.ts, which knows where a visit
         from a preview page really came from; localhost is never counted. -->
    <script>window.goatcounter = { no_onload: true }</script>
    <script id="goatcounter" data-goatcounter="https://hall-of-faces.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
